<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Сливенска епархия — интерактивна карта</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
  :root{
    --accent:#7b1f2b;        /* дълбоко бордо — църковен акцент */
    --accent-2:#b8860b;      /* старо злато */
    --ink:#1d2127;
    --panel:rgba(255,255,255,.94);
  }
  html,body{margin:0;height:100%;font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);}
  #map{position:absolute;inset:0;background:#dfe6ea;}
  .panel{
    position:absolute;z-index:1000;top:14px;left:14px;
    width:min(290px, calc(100vw - 28px));box-sizing:border-box;
    background:var(--panel);backdrop-filter:blur(6px);
    border:1px solid rgba(0,0,0,.08);border-radius:14px;
    box-shadow:0 8px 30px rgba(0,0,0,.18);padding:14px 16px;
  }
  .panel h1{margin:0 0 2px;font-size:17px;letter-spacing:.2px;}
  .panel .sub{margin:0 0 10px;font-size:12px;color:#5a626b;}
  .legend{display:flex;flex-direction:column;gap:7px;font-size:12.5px;}
  /* малки екрани: по-компактен панел, за да не заема половината карта */
  @media (max-width:480px){
    .panel{top:10px;left:10px;padding:10px 12px;border-radius:12px;}
    .panel h1{font-size:15px;}
    .panel .sub{font-size:11px;margin-bottom:8px;}
    .legend{font-size:12px;gap:6px;}
    .credit{font-size:9.5px;}
  }
  /* нисък екран (напр. iframe): панелът не бива да изяжда височината */
  @media (max-height:420px){
    .panel{top:8px;left:8px;padding:8px 11px;}
    .panel .sub{display:none;}
    .panel h1{margin-bottom:6px;}
  }
  .legend .row{display:flex;align-items:center;gap:9px;}
  .swatch{width:16px;height:16px;border-radius:4px;flex:0 0 auto;}
  .dot{width:14px;height:14px;border-radius:50%;background:var(--accent);
       border:2px solid #fff;box-shadow:0 0 0 1px var(--accent);flex:0 0 auto;}
  .count{margin-left:auto;font-weight:600;color:var(--accent);}
  .credit{position:absolute;z-index:1000;bottom:6px;left:8px;font-size:10.5px;color:#5a626b;
          background:rgba(255,255,255,.7);padding:1px 6px;border-radius:5px;}
  /* модерен попъп */
  .leaflet-popup-content-wrapper{border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);}
  .leaflet-popup-content{margin:12px 14px;}
  .pop-title{font-size:15px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:6px;}
  .pop-meta{font-size:12.5px;color:#444;margin-top:3px;}
  .pop-meta b{color:var(--ink);}
  .mon-marker{filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));}
</style>
</head>
<body>
<div id="map"></div>

  <h1>Сливенска епархия</h1>
  <p class="sub">Интерактивна карта · граници и обекти</p>

    <div class="row"><span class="dot"></span> Манастири <span class="count" id="monCount">0</span></div>
    <div class="row"><span class="swatch" style="background:rgba(123,31,43,.12);border:2px solid #7b1f2b"></span> Територия на епархията</div>
  </div>
</div>

<div class="credit">Подложка: © OpenTopoMap / OpenStreetMap · Данни: Сливенска епархия</div>

/* ---------- Карта ---------- */
const map = L.map('map', { zoomControl:false, minZoom:7, maxZoom:16 }).setView([42.4,27.1],8);

const relief = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
  maxZoom:17, attribution:'© OpenTopoMap (CC-BY-SA) · © OpenStreetMap'
});
relief.addTo(map);
L.control.zoom({position:'topright'}).addTo(map);

/* Граница на епархията */
const epLayer = L.geoJSON(window.EPARHIYA, {
  style:{ color:'#7b1f2b', weight:2.5, fillColor:'#7b1f2b', fillOpacity:0.08 }
}).addTo(map);

/* Маска: затъмнява всичко извън епархията => „само епархията" */
function buildMask(fc){
  const outer=[[-85,-179],[-85,179],[85,179],[85,-179]];
  const holes=[];
  fc.features.forEach(f=>{
    const g=f.geometry; const polys = g.type==='MultiPolygon'?g.coordinates:[g.coordinates];
    polys.forEach(poly=> holes.push(poly[0].map(([x,y])=>[y,x])) ); // външен пръстен, в [lat,lng]
  });
  return L.polygon([outer,...holes],{stroke:false,fillColor:'#10151b',fillOpacity:0.55,interactive:false});
}
buildMask(window.EPARHIYA).addTo(map);
epLayer.bringToFront();

/* Манастири */
const monIcon = L.divIcon({
  className:'', html:'<svg class="mon-marker" width="26" height="26" viewBox="0 0 24 24">'
    +'<circle cx="12" cy="12" r="9" fill="#7b1f2b" stroke="#fff" stroke-width="2"/>'
    +'<path d="M12 6v3M10.5 7.5h3M12 9.5c-2 0-3.2 1.4-3.2 3.3V17h6.4v-4.2C15.2 10.9 14 9.5 12 9.5z" '
    +'fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/></svg>',
  iconSize:[26,26], iconAnchor:[13,13], popupAnchor:[0,-12]
});
const monLayer = L.geoJSON(window.MONASTERIES,{
  pointToLayer:(f,latlng)=>L.marker(latlng,{icon:monIcon}),
  onEachFeature:(f,layer)=>{
    const p=f.properties;
    layer.bindPopup(
      '<div class="pop-title">⛪ '+(p.Name||'—')+' манастир</div>'
      +'<div class="pop-meta"><b>Епархия:</b> Сливенска</div>'
      ,{maxWidth:260});
    layer.bindTooltip(p.Name,{direction:'top',offset:[0,-10]});
  }
}).addTo(map);
document.getElementById('monCount').textContent = window.MONASTERIES.features.length;

/* Фокус върху епархията */
const b = epLayer.getBounds();
function focusEparhiya(){ map.invalidateSize(); map.fitBounds(b,{padding:[30,30]}); map.setMaxBounds(b.pad(0.35)); }
focusEparhiya();
// коригира размера при вграждане в iframe / късно оразмеряване на контейнера
setTimeout(focusEparhiya, 200);
window.addEventListener('load', focusEparhiya);
let rt; window.addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(()=>map.invalidateSize(), 150); });
</script>
